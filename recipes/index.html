<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walmart Mobile Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="status-bar">
        <span class="time">9:41</span>
        <div class="battery-indicator"></div>
        <div class="Wifi-indicator">[]  </div>
    </div> 

    <div class="search-container">
        <input type="text" class="search-input" placeholder="🔍Search Walmart "  >
    
    
    
        <div class="header-actions">
            <div class="cart-info">
                <!-- Replace emoji with cart icon -->
                <span class="icon cart-icon">🛒</span>
                
                <span class="cart-price">$0.00</span>
            </div>
            <!-- Replace emoji with menu/hamburger icon -->
            <span class="icon menu-icon">></span>
        </div>
        <div class="delivery-info">
            How do you want your items? | 958789
        </div>
    </div>
   
</header>

    <nav class="main-navigation">
        <div class="nav-item">Record</div>
        <div class="nav-item">List</div>
        <div class="nav-item">Registry</div>
        <div class="nav-item">Recipe</div>
    </nav>

 <main class="content-area">
        <div class="empty-state">
            <h2 class="empty-title">No Saved Recipe Yet</h2>
            <button class="cta-button">Start shopping</button>
        </div>
    </main>

    <!-- New Footer with Icons -->
    <footer class="main-footer">
        <div class="footer-container">
          
            <div class="footer-item">
                
                <img src="/Frame 1/images/home.jpg">
                <span class="footer-label">Home</span>
            </div>
            <div class="footer-item">
                
                <img src="/Frame 2/images/heart.jpg">
                <span class="footer-label">My Items</span>
            </div>
            <div class="footer-item">
                <img src="/Frame 2/images/search.jpg">
                <span class="footer-label">Search</span>
            </div>
            <div class="footer-item">
                <img src="/Frame 1/images/tag.jpg"> 
                <span class="footer-label">Savings</span>
            </div>
            <div class="footer-item">
                <img src="/Frame 1/images/AskAI.jpg">
                <span class="footer-label">Ask AI</span>
            </div>
        </div>
    </footer>
</body>
</html>
